<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#1c1917"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VistaEarn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#1c1917;--card:#2a2623;--card2:#35302c;--line:#4a423b;--p1:#e0b184;--p2:#b9814f;--p3:#7a4d2a;--gold:#e9c58f;--tx:#faf5ee;--mu:#b8aa9b}
*{box-sizing:border-box;margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
html{-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(90% 40% at 50% -5%,#4a3626 0,transparent 70%),var(--bg);height:100vh;height:100dvh;overflow:hidden;color:var(--tx);-webkit-font-smoothing:antialiased}
html{height:100%;overflow:hidden}
#app{height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:140px}
.w{max-width:480px;margin:auto;padding:16px;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:800;letter-spacing:-.5px}
.brand .lg{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--p2));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;font-style:italic;color:#26170b;box-shadow:0 6px 18px rgba(185,129,79,.4)}
.brand span{color:var(--gold)}
.pill{background:var(--card2);border:1px solid var(--line);color:var(--gold);border-radius:22px;padding:9px 16px;font-weight:800;font-size:16px}
.tag{font-size:12px;color:var(--mu);text-align:right;line-height:1.4}
.logo{font-size:28px;font-weight:800}.logo span{color:var(--gold)}
.hero{background:linear-gradient(135deg,#b9814f,#8a5a35 60%,#5e3d24);border-radius:30px;padding:22px;margin-bottom:16px;box-shadow:0 14px 40px rgba(122,77,42,.4)}
.hero h1{font-size:26px;line-height:1.2}.hero h1 b{color:var(--gold)}.hero p{margin-top:8px;color:#f6e9d6;line-height:1.5}
.hero2{background:linear-gradient(135deg,#c48a56,#96603a 55%,#63402a);border-radius:32px;padding:24px;margin-bottom:16px;box-shadow:0 16px 44px rgba(122,77,42,.45);position:relative;overflow:hidden}
.hero2:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero2 small{color:#f6e9d6;font-size:15px;position:relative;z-index:1}
.hero2 .big{font-size:50px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 14px;position:relative;z-index:1}
.bar{height:11px;background:rgba(255,255,255,.22);border-radius:8px;overflow:hidden;margin-bottom:10px;position:relative;z-index:1}.bar i{display:block;height:100%;background:var(--gold);border-radius:8px;min-width:4%}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-top:18px;position:relative;z-index:1}
.wdb{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:30px;padding:13px 22px;font-weight:800;font-size:16px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px}
.card h3,h3.ttl{font-size:19px;margin:0 0 8px;color:var(--tx)}
.card small,.card p{color:var(--mu)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.st{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 4px;text-align:center}
.st b{display:block;font-size:19px}.st span{color:var(--mu);font-size:14px}
.sec{font-size:26px;font-weight:800;margin:26px 0 14px;letter-spacing:-.4px;display:flex;justify-content:space-between;align-items:center}
.sec a{font-size:14px;color:var(--p1);font-weight:700;cursor:pointer}
.t{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;margin-bottom:14px}
.tic{width:62px;height:62px;border-radius:18px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.t .m{flex:1;min-width:0}.t b{font-size:18px;line-height:1.25;display:block}.t small{display:block;color:var(--mu);margin-top:4px;font-size:14px}
.rw{text-align:right;flex:none}.amt{color:var(--gold);font-weight:800;font-size:20px;margin-bottom:6px}
.btn{background:linear-gradient(135deg,var(--p1),var(--p2));color:#26170b;border:0;border-radius:30px;padding:14px 20px;font-weight:800;font-size:16px;cursor:pointer;width:100%;box-shadow:0 8px 20px rgba(185,129,79,.3);transition:transform .12s}
.btn:active{transform:scale(.96)}.btn.s{width:auto;padding:10px 22px;font-size:15px}.btn:disabled{opacity:.5;box-shadow:none}
.btn.d{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--tx)}
.btn.gold{background:linear-gradient(135deg,#f6e6cc,#dcb27f);color:#26170b;box-shadow:0 8px 20px rgba(220,178,127,.3)}
input,select{width:100%;padding:15px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);margin:6px 0;font-size:16px}
input::placeholder{color:#8f8478}input:focus,select:focus{outline:0;border-color:var(--p1);box-shadow:0 0 0 3px rgba(224,177,132,.28)}
table{width:100%;font-size:14px;border-collapse:collapse;color:var(--tx)}td,th{padding:11px 4px;border-bottom:1px solid var(--line);text-align:left}tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;margin:0 auto;max-width:456px;background:linear-gradient(#f9efe0,#ecd8bc);border-radius:34px;display:flex;align-items:stretch;padding:6px 6px;z-index:5;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.nav a{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 18px;color:#2a2623;font-size:14px;font-weight:700;cursor:pointer}
.nav a+a:before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:1px;background:rgba(80,55,35,.22)}
.nav a svg{width:28px;height:28px}
.nav a.on{color:#8a5530}.nav a.on[data-v=home] svg{fill:currentColor}
.nav a.on:after{content:"";position:absolute;bottom:6px;left:16%;right:16%;height:4px;border-radius:3px;background:#8a5530}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#26170b;padding:11px 20px;border-radius:24px;font-weight:800;display:none;z-index:9;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tabs{flex-wrap:wrap}.tabs button{min-width:30%}
.ur{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.ur:last-child{border-bottom:0}
.ua{display:flex;flex-direction:column;gap:6px;flex:none}.ua .btn{padding:8px 14px;font-size:13px}
.bd{color:#f87171;font-weight:800;font-size:12px}.ad{color:var(--gold);font-weight:800;font-size:12px}
</style></head><body>
<div id="toast"></div><div id="nav"></div><div class="w" id="app"><p style="text-align:center;margin-top:40vh;color:#e0b184;font-size:20px">Loading VistaEarn...</p></div>
<script>
// ===== CONFIG: paste from Supabase > Project Settings > API =====
const SB_URL="https://dugcoxabchdbtdsufbwm.supabase.co", SB_KEY="sb_publishable_SU6sY8o6u0JwERCBGiIO_g_mE6hSW_0";
const SUPPORT="https://t.me/allverifird";let MIN_WD=30000,REFB=500,WELB=1000;
// ================================================================
let sb;
let me,tasks=[],log={},wds=[],view='home',mode='login',adm='overview',users=[],allW=[],allT=[],pend={};
const $=s=>document.querySelector(s),N=n=>'₦'+Number(n||0).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
async function run(p,ok){const{error}=await p;if(error)toast(error.message);else{if(ok)toast(ok);await load()}}

async function boot(){
  await loadCfg();
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  await load();
}
let REF=new URLSearchParams(location.search).get('ref')||'';
function authView(){
  if(REF&&mode=='login'&&!authView.t){mode='reg';authView.t=1}
  const reg=mode=='reg';$('#nav').innerHTML='';
  $('#app').innerHTML=`<div class="topbar" style="margin-top:14px"><div class="brand"><div class="lg">V</div><div>Vista<span>Earn</span></div></div></div>
  <p style="color:var(--mu);margin:-4px 0 18px;line-height:1.5">Read news. Complete tasks. Earn real money.</p>
  <div class="card" style="padding:22px"><h3 style="margin:0 0 ${reg?4:14}px;font-size:22px">${reg?'Create account':'Welcome back'}</h3>
  ${reg?'<p style="margin:0 0 12px;font-size:14px">Get a ${N(WELB)} welcome bonus when you join.</p>':''}
  ${reg?'<input id="nm" placeholder="Your name" autocomplete="name">':''}
  <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="${reg?'Password (6+ characters)':'Password'}" autocomplete="${reg?'new-password':'current-password'}">
  <br><br><button class="btn" id="go">${reg?'Create account':'Log in'}</button>
  <button class="btn d" id="sw" style="margin-top:12px">${reg?'Have an account? Log in':'New here? Create account'}</button></div>`;
  $('#sw').onclick=()=>{mode=reg?'login':'reg';authView()};
  $('#go').onclick=async()=>{
    const email=$('#em').value.trim(),password=$('#pw').value;
    const r=reg?await sb.auth.signUp({email,password,options:{data:{name:$('#nm').value.trim(),ref:REF}}}):await sb.auth.signInWithPassword({email,password});
    if(r.error)return toast(r.error.message);
    if(!r.data.session)return toast('Check your email to confirm, then log in');
    history.replaceState(null,'',location.pathname);REF='';await load();
  };
}
async function loadCfg(){try{const{data}=await sb.from('settings').select('*');(data||[]).forEach(r=>{if(r.key=='min_withdrawal')MIN_WD=+r.value;if(r.key=='welcome_bonus')WELB=+r.value;if(r.key=='referral_bonus')REFB=+r.value})}catch(e){}}
async function load(){
  await loadCfg();
  const{data:{user}}=await sb.auth.getUser();
  const[p,t,l,w]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).single(),sb.from('tasks').select('*').eq('active',true).order('sort'),sb.from('task_log').select('*'),sb.from('withdrawals').select('*').eq('user_id',user.id).order('id',{ascending:false})]);
  me=p.data;tasks=t.data||[];log={};(l.data||[]).forEach(x=>log[x.task_id]=x);wds=w.data||[];
  if(me.is_admin&&view=='admin'){users=(await sb.from('profiles').select('*').order('created_at',{ascending:false})).data||[];allW=(await sb.from('withdrawals').select('*').order('id',{ascending:false})).data||[];allT=(await sb.from('tasks').select('*').order('sort')).data||[]}
  draw();
}
const done=()=>tasks.filter(t=>log[t.id]?.done).length;
const ICON=t=>/telegram/i.test(t.title)?'✈️':/facebook/i.test(t.title)?'👍':'📰';
const SV=p=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={home:SV('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),tasks:SV('<path d="M9 6h11M9 12h11M9 18h11M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>'),wallet:SV('<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>'),profile:SV('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')};
function taskRow(t){
  const l=log[t.id],d=l?.done;
  let btn=d?'<button class="btn d s" disabled>Done ✓</button>':l?`<button class="btn gold s" data-c="${t.id}">I completed</button>`:`<button class="btn s" data-o="${t.id}">Open</button>`;
  return `<div class="t"><div class="tic">${ICON(t)}</div><div class="m"><b>${esc(t.title)}</b><small>${t.seconds} sec · ${d?'Completed':l?'Come back & tap I completed':'Task'}</small></div><div class="rw"><div class="amt">+${N(t.reward)}</div>${btn}</div></div>`;
}
function walletCard(){
  const pct=Math.min(100,me.balance/MIN_WD*100);
  return `<div class="hero2"><small>Wallet balance</small><div class="big">${N(me.balance)}</div><div class="bar"><i style="width:${pct}%"></i></div><small>${N(me.balance)} of ${N(MIN_WD)} minimum withdrawal</small>
  <div class="hrow"><small>Total earned ${N(me.earned)}</small>${view=='home'?'<button class="wdb" data-v="wallet">↓ Withdraw</button>':''}</div></div>`;
}
function stats(){return `<div class="g3"><div class="st"><b>${N(me.earned)}</b><span>Earned</span></div><div class="st"><b>${done()}/${tasks.length}</b><span>Tasks done</span></div><div class="st"><b>${me.referrals}</b><span>Referrals</span></div></div>`}
const inviteRow=()=>`<div class="t"><div class="tic">👥</div><div class="m"><b>Invite friends</b><small>Earn ${N(REFB)} for every friend</small></div><div class="rw"><div class="amt">+${N(REFB)}</div><button class="btn s" data-v="profile">Invite</button></div></div>`;
function draw(){
  if(me.is_banned){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="topbar" style="margin-top:14px"><div class="brand"><div class="lg">V</div><div>Vista<span>Earn</span></div></div></div><div class="card"><h3>Account banned</h3><p>Your account has been banned. Contact support if you think this is a mistake.</p><a href="${SUPPORT}" target="_blank" class="btn d" style="display:block;text-align:center;text-decoration:none;margin-top:14px">Contact Support</a><button class="btn d" id="lo" style="margin-top:12px">Logout</button></div>`;wire();return}
  let h=`<div class="topbar"><div class="brand"><div class="lg">V</div><div>Vista<span>Earn</span></div></div><div class="pill">${N(me.balance)}</div></div>`;
  if(view=='home')h+=`${walletCard()}${stats()}<div class="sec">Available tasks</div>${tasks.map(taskRow).join('')}${inviteRow()}`;
  if(view=='tasks')h+=`${stats()}<div class="sec">All tasks</div>${tasks.map(taskRow).join('')}${inviteRow()}`;
  if(view=='wallet')h+=`${walletCard()}<div class="card"><h3>Withdraw money</h3><small>Minimum withdrawal ${N(MIN_WD)}</small>
  <input id="wa" type="number" placeholder="Amount"><input id="wb" placeholder="Bank name"><input id="wn" placeholder="Account number"><input id="wm" placeholder="Account name">
  <br><br><button class="btn" id="wd">Request withdrawal</button></div>
  <div class="sec">History</div><div class="card"><table>${wds.map(x=>`<tr><td>${N(x.amount)}</td><td>${esc(x.bank)}</td><td>${x.status}</td></tr>`).join('')||'<tr><td>No withdrawals yet</td></tr>'}</table></div>`;
  if(view=='profile'){const link=location.origin+location.pathname+'?ref='+me.ref_code;
  h+=`${stats()}<div class="card" style="margin-top:14px"><div style="display:flex;align-items:center;gap:14px"><div class="tic">👤</div><div><b style="font-size:18px">${esc(me.name)}</b><br><small>${esc(me.email)}</small></div></div></div>
  <div class="card"><h3>Your referral link</h3><input readonly value="${link}" id="rl"><br><br><button class="btn" id="cp">Copy link</button><p style="margin-top:10px;font-size:14px">Earn ${N(REFB)} immediately when someone registers with your link.</p></div>
  <a href="${SUPPORT}" target="_blank" class="btn d" style="display:block;text-align:center;text-decoration:none;margin-bottom:14px">Contact Support</a>
  ${me.is_admin?'<button class="btn gold" data-v="admin">Admin dashboard</button><br><br>':''}<button class="btn d" id="lo">Logout</button>`}
  if(view=='admin')h+=adminHTML();
  const nv=(v,n)=>`<a data-v="${v}" class="${view==v?'on':''}">${IC[v]}${n}</a>`;
  $('#nav').innerHTML=`<div class="nav">${nv('home','Home')}${nv('tasks','Tasks')}${nv('wallet','Wallet')}${nv('profile','Profile')}</div>`;
  $('#app').innerHTML=h;wire();
}
function adminHTML(){
  const tabs=['overview','users','tasks','withdrawals','settings'];
  let h=`<div class="tabs">${tabs.map(x=>`<button class="btn ${adm==x?'':'d'} s" data-a="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`;
  if(adm=='overview'){
    const pw=allW.filter(x=>x.status=='pending'),sum=l=>l.reduce((t,x)=>t+Number(x.amount),0);
    h+=`<div class="g3"><div class="st"><b>${users.length}</b><span>Users</span></div><div class="st"><b>${pw.length}</b><span>Pending</span></div><div class="st"><b>${users.filter(u=>u.is_banned).length}</b><span>Banned</span></div></div>
    <div class="card" style="margin-top:14px"><table><tr><td>Total user balances</td><td>${N(users.reduce((t,u)=>t+Number(u.balance),0))}</td></tr><tr><td>Pending withdrawals</td><td>${N(sum(pw))}</td></tr><tr><td>Total paid out</td><td>${N(sum(allW.filter(x=>x.status=='approved')))}</td></tr><tr><td>Live tasks</td><td>${allT.filter(t=>t.active).length}</td></tr></table></div>`;
  }
  if(adm=='users')h+=`<div class="card"><input id="us" placeholder="Search name or email">${users.map(u=>`<div class="ur" data-s="${esc((u.email+' '+u.name).toLowerCase())}"><div style="min-width:0"><b>${esc(u.name||'No name')}</b>${u.is_banned?' <span class="bd">BANNED</span>':''}${u.is_admin?' <span class="ad">ADMIN</span>':''}<br><small>${esc(u.email)}</small><br><small>${N(u.balance)} · ${u.referrals} referrals</small></div><div class="ua"><button class="btn s" data-cr="${u.id}">± Money</button>${u.is_admin?'':`<button class="btn d s" data-ban="${u.id}" data-b="${u.is_banned?0:1}">${u.is_banned?'Unban':'Ban'}</button>`}</div></div>`).join('')}</div>`;
  if(adm=='tasks')h+=`<div class="card"><h3>Add new task</h3><input id="at" placeholder="Title"><input id="ad" placeholder="Description"><input id="al" placeholder="Link (https://...)"><input id="ar" type="number" placeholder="Reward (₦)" value="500"><input id="as" type="number" placeholder="Seconds to wait" value="20"><button class="btn" id="addt" style="margin-top:10px">Add task</button></div>
  <div class="card"><h3>All tasks</h3>${allT.map(t=>`<div class="ur"><div style="min-width:0"><b>${esc(t.title)}</b>${t.active?'':' <span class="bd">HIDDEN</span>'}<br><small>${N(t.reward)} · ${t.seconds}s</small></div><div class="ua"><button class="btn s" data-edit="${t.id}">Edit</button><button class="btn d s" data-tog="${t.id}" data-b="${t.active?0:1}">${t.active?'Hide':'Show'}</button><button class="btn d s" data-del="${t.id}">Delete</button></div></div>`).join('')||'<small>No tasks yet</small>'}</div>`;
  if(adm=='withdrawals')h+=`<div class="card">${[...allW].sort((a,b)=>(a.status=='pending'?0:1)-(b.status=='pending'?0:1)||b.id-a.id).map(x=>{const u=users.find(u=>u.id==x.user_id)||{};return `<div class="ur"><div style="min-width:0"><b>${N(x.amount)}</b> · ${x.status}<br><small>${esc(u.name)} · ${esc(u.email)}</small><br><small>${esc(x.bank)} · ${esc(x.acct_no)} · ${esc(x.acct_name)}</small></div><div class="ua">${x.status=='pending'?`<button class="btn s" data-ap="${x.id}">Approve</button><button class="btn d s" data-rj="${x.id}">Reject</button>`:''}</div></div>`}).join('')||'<small>No withdrawals yet</small>'}</div>`;
  if(adm=='settings')h+=`<div class="card"><h3>Settings</h3><small>Minimum withdrawal (₦)</small><input id="s1" type="number" value="${MIN_WD}"><small>Welcome bonus (₦)</small><input id="s2" type="number" value="${WELB}"><small>Referral bonus (₦)</small><input id="s3" type="number" value="${REFB}"><button class="btn" id="sv" style="margin-top:12px">Save settings</button></div>`;
  return h;
}
function wire(){
  document.querySelectorAll('[data-v]').forEach(e=>e.onclick=async()=>{view=e.dataset.v;await load()});
  document.querySelectorAll('[data-o]').forEach(e=>e.onclick=async()=>{
    const t=tasks.find(x=>x.id==e.dataset.o);window.open(t.link,'_blank');
    await run(sb.rpc('start_task',{t:t.id}),`Spend ${t.seconds}s on the task, then come back`)});
  document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>run(sb.rpc('complete_task',{t:+e.dataset.c}),'Reward added!'));
  const g=id=>document.getElementById(id);
  if(g('wd'))g('wd').onclick=()=>run(sb.rpc('withdraw',{a:+g('wa').value,b:g('wb').value,n:g('wn').value,nm:g('wm').value}),'Withdrawal requested');
  if(g('cp'))g('cp').onclick=()=>{navigator.clipboard.writeText(g('rl').value);toast('Copied')};
  if(g('lo'))g('lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
  document.querySelectorAll('[data-a]').forEach(e=>e.onclick=async()=>{adm=e.dataset.a;await load()});
  if(g('us'))g('us').oninput=e=>document.querySelectorAll('.ur').forEach(r=>r.style.display=r.dataset.s.includes(e.target.value.toLowerCase())?'':'none');
  document.querySelectorAll('[data-cr]').forEach(e=>e.onclick=()=>{const a=prompt('Amount to add (negative to deduct):');if(a)run(sb.rpc('admin_credit',{u:e.dataset.cr,a:+a}),'Balance updated')});
  if(g('addt'))g('addt').onclick=()=>run(sb.from('tasks').insert({title:g('at').value,descr:g('ad').value,link:g('al').value,reward:+g('ar').value,seconds:+g('as').value,sort:tasks.length+1}),'Task added');
  document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>confirm('Delete this task for good?')&&run(sb.from('tasks').delete().eq('id',e.dataset.del),'Task deleted'));
  document.querySelectorAll('[data-ap]').forEach(e=>e.onclick=()=>run(sb.rpc('admin_withdrawal',{w:+e.dataset.ap,ok:true}),'Approved'));
  document.querySelectorAll('[data-rj]').forEach(e=>e.onclick=()=>run(sb.rpc('admin_withdrawal',{w:+e.dataset.rj,ok:false}),'Rejected & refunded'));
  document.querySelectorAll('[data-ban]').forEach(e=>e.onclick=()=>{const b=e.dataset.b=='1';if(confirm(b?'Ban this user?':'Unban this user?'))run(sb.rpc('admin_set_banned',{u:e.dataset.ban,b}),b?'User banned':'User unbanned')});
  document.querySelectorAll('[data-tog]').forEach(e=>e.onclick=()=>run(sb.from('tasks').update({active:e.dataset.b=='1'}).eq('id',e.dataset.tog),'Task updated'));
  document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>{const t=allT.find(x=>x.id==e.dataset.edit);const title=prompt('Title',t.title);if(title===null)return;const descr=prompt('Description',t.descr||'');if(descr===null)return;const link=prompt('Link',t.link||'');if(link===null)return;const reward=prompt('Reward (₦)',t.reward);if(reward===null)return;const seconds=prompt('Seconds to wait',t.seconds);if(seconds===null)return;run(sb.from('tasks').update({title,descr,link,reward:+reward,seconds:+seconds}).eq('id',t.id),'Task saved')});
  if(g('sv'))g('sv').onclick=()=>run(sb.from('settings').upsert([{key:'min_withdrawal',value:+g('s1').value},{key:'welcome_bonus',value:+g('s2').value},{key:'referral_bonus',value:+g('s3').value}]),'Settings saved');
}
function lib(u){return new Promise(r=>{const e=document.createElement('script');e.src=u;e.onload=()=>r(true);e.onerror=()=>r(false);document.head.appendChild(e)})}
(async()=>{
  try{
    if(!window.supabase){
      for(const u of ['https://unpkg.com/@supabase/supabase-js@2.57.4/dist/umd/supabase.js','https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.57.4/supabase.min.js']){ if(await lib(u)&&window.supabase)break; }
    }
    if(!window.supabase)throw new Error('Could not load. Check your internet and refresh.');
    sb=supabase.createClient(SB_URL,SB_KEY);
    await boot();
  }catch(e){
    $('#app').innerHTML='<div class="card" style="margin-top:30px"><b>Something went wrong</b><p style="margin:8px 0">'+esc(e.message||e)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';
  }
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})})}
